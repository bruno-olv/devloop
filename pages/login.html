<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">🔒</div>
        <h1>Entrar</h1>
        <p>Acesse sua conta</p>
    </div>

    <div class="card">

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        <div class="msg" id="msg"></div>

    </div>

    <div class="register-link">
        Não possui conta?
        <a href="register.html">
            Criar conta
        </a>
    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
