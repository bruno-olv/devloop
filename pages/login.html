<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --border:#334155;
    --primary:#38bdf8;
    --primary-hover:#22d3ee;
    --text:#f8fafc;
    --secondary:#94a3b8;
}

body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:60px;
    height:60px;
    margin:auto;
    border-radius:15px;
    background:linear-gradient(135deg,var(--primary),var(--primary-hover));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0f172a;
    font-size:26px;
    font-weight:bold;
}

.logo h1{
    margin-top:15px;
    color:white;
}

.logo p{
    color:var(--secondary);
    margin-top:5px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:35px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    color:var(--secondary);
    margin-bottom:8px;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#111827;
    color:white;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(56,189,248,.15);
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    font-weight:700;
    margin-top:10px;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-hover)
    );
    color:#0f172a;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

.msg{
    text-align:center;
    margin-top:15px;
    color:white;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:var(--secondary);
}

.register-link a{
    color:var(--primary);
    text-decoration:none;
    font-weight:600;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">🔒</div>
        <h1>Entrar</h1>
        <p>Acesse sua conta</p>
    </div>

    <div class="card">

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        <div class="msg" id="msg"></div>

    </div>

    <div class="register-link">
        Não possui conta?
        <a href="register.html">
            Criar conta
        </a>
    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
