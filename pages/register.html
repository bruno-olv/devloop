<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #38BDF8;
            --primary-hover: #22D3EE;
            --background-color: #0F172A;
            --secondary-color: #111827;
            --card-color: #1E293B;
            --border-color: #334155;
            --text-color: #F8FAFC;
            --text-secondary: #94A3B8;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .brand-icon svg {
            width: 26px;
            height: 26px;
            fill: var(--background-color);
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.01em;
        }

        input {
            width: 100%;
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 0.9375rem;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder {
            color: var(--border-color);
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        input.error {
            border-color: #F87171;
            box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.12);
        }

        .error-msg {
            display: none;
            font-size: 0.75rem;
            color: #F87171;
            margin-top: 6px;
        }

        .error-msg.visible {
            display: block;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.15s;
        }

        .toggle-pw:hover {
            color: var(--primary-color);
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-segment {
            height: 3px;
            flex: 1;
            border-radius: 99px;
            background-color: var(--border-color);
            transition: background-color 0.3s;
        }

        .strength-segment.weak   { background-color: #F87171; }
        .strength-segment.medium { background-color: #FBBF24; }
        .strength-segment.strong { background-color: #34D399; }

        .strength-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: right;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 24px 0;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
        }

        .terms input[type="checkbox"] {
            width: 16px;
            height: 16px;
            min-width: 16px;
            margin-top: 2px;
            accent-color: var(--primary-color);
            cursor: pointer;
            padding: 0;
            border-radius: 4px;
        }

        .terms label {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 0;
            cursor: pointer;
        }

        .terms a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: var(--background-color);
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.875rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: translateY(80px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .toast-icon.success { background-color: rgba(52, 211, 153, 0.2); color: #34D399; }
        .toast-icon.error   { background-color: rgba(248, 113, 113, 0.2); color: #F87171; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1>Criar conta</h1>
        <p>Preencha os dados abaixo para se cadastrar</p>
    </div>

    <div class="card">
        <form id="registerForm" novalidate>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Nome</label>
                    <input type="text" id="firstName" name="firstName" placeholder="João" autocomplete="given-name">
                    <span class="error-msg" id="firstNameError">Informe seu nome.</span>
                </div>
                <div class="form-group">
                    <label for="lastName">Sobrenome</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Silva" autocomplete="family-name">
                    <span class="error-msg" id="lastNameError">Informe seu sobrenome.</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="joao@exemplo.com" autocomplete="email">
                <span class="error-msg" id="emailError">Informe um e-mail válido.</span>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                    <button type="button" class="toggle-pw" id="togglePassword" aria-label="Mostrar senha">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="strength-bar">
                    <div class="strength-segment" id="s1"></div>
                    <div class="strength-segment" id="s2"></div>
                    <div class="strength-segment" id="s3"></div>
                    <div class="strength-segment" id="s4"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
                <span class="error-msg" id="passwordError">A senha deve ter pelo menos 8 caracteres.</span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar senha</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita a senha" autocomplete="new-password">
                    <button type="button" class="toggle-pw" id="toggleConfirm" aria-label="Mostrar confirmação">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <span class="error-msg" id="confirmPasswordError">As senhas não coincidem.</span>
            </div>

            <div class="divider"></div>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">
                    Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>
                </label>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Criar conta</button>
        </form>
    </div>

    <p class="login-link">Já tem uma conta? <a href="#">Entrar</a></p>
</div>

<div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon"></span>
    <span id="toastMsg"></span>
</div>

<script src="../js/auth.js"></script>

</body>
</html>
